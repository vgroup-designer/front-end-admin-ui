services:
  - type: web
    name: shopify-admin-agent
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run web
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_API_VERSION
        value: "2024-10"
